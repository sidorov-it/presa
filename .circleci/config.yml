version: 2.1

orbs:
  node: circleci/node@5

parameters:
  deploy_target:
    type: string
    default: "production"

executors:
  node-executor:
    docker:
      - image: cimg/node:22.0
    resource_class: large
    environment:
      NODE_OPTIONS: "--max-old-space-size=4096"

commands:
  save_build_cache:
    steps:
      - save_cache:
          key: v1-next-cache-{{ .Branch }}-{{ .Revision }}
          paths:
            - .next/cache

  restore_build_cache:
    steps:
      - restore_cache:
          keys:
            - v1-next-cache-{{ .Branch }}-{{ .Revision }}
            - v1-next-cache-{{ .Branch }}-
            - v1-next-cache-

  create_deployment_package:
    steps:
      - run:
          name: Create deployment package
          command: |
            mkdir deploy-package
            cp -r .next deploy-package/
            cp -r public deploy-package/
            cp -r prisma deploy-package/
            cp package*.json deploy-package/
            cp next.config.js deploy-package/
            cp ecosystem.config.js deploy-package/
            cp -r src deploy-package/
            cp scripts/deploy.sh deploy-package/
            chmod +x deploy-package/deploy.sh
            tar -czf deploy-package.tar.gz deploy-package/

  deploy_to_server:
    steps:
      - run:
          name: Install sshpass
          command: sudo apt-get update && sudo apt-get install sshpass
      - run:
          name: Copy files to server
          command: |
            sshpass -p ${SERVER_PASSWORD} scp -o StrictHostKeyChecking=no \
              -P ${SERVER_PORT} \
              deploy-package.tar.gz ${SERVER_USER}@${SERVER_HOST}:/var/www/slydle/
      - run:
          name: Execute deployment script
          command: |
            sshpass -p ${SERVER_PASSWORD} ssh -o StrictHostKeyChecking=no \
              -p ${SERVER_PORT} ${SERVER_USER}@${SERVER_HOST} \
              "cd /var/www/slydle && tar -xzf deploy-package.tar.gz && DATABASE_URL='${DATABASE_URL}' NEXTAUTH_SECRET='${NEXTAUTH_SECRET}' NEXTAUTH_URL='${NEXTAUTH_URL}' ./deploy-package/deploy.sh '${DATABASE_URL}' '${NEXTAUTH_SECRET}' '${NEXTAUTH_URL}'"

jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - restore_build_cache
      - node/install-packages:
          pkg-manager: npm
          cache-path: ~/project/node_modules
          override-ci-command: npm ci
      - run:
          name: Generate Prisma Client
          command: npx prisma generate
      - run:
          name: Build application
          command: npm run build
          environment:
            DATABASE_URL: ${DATABASE_URL}
            NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
            NEXTAUTH_URL: ${NEXTAUTH_URL}
      - save_build_cache
      - create_deployment_package
      - persist_to_workspace:
          root: .
          paths:
            - deploy-package.tar.gz

  deploy:
    executor: node-executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - deploy_to_server

  health-check:
    executor: node-executor
    steps:
      - run:
          name: Wait for deployment
          command: sleep 30
      - run:
          name: Health check
          command: |
            curl -f ${NEXTAUTH_URL}/api/health || exit 1

workflows:
  version: 2
  build-deploy:
    jobs:
      - build:
          filters:
            branches:
              only:
                - main
                - master
      - deploy:
          requires:
            - build
      - health-check:
          requires:
            - deploy 